[project]
name = "flow-manager-fast-api"
version = "0.1.0"
description = ""
authors = [
    {name = "chilledsnake"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn (>=0.34.0,<1.0.0)",
    "ruff (>=0.15.14,<0.16.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=6.0.0,<7.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)"
]


[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
addopts = "--cov=app"

[tool.coverage.run]
omit = ["app/main.py", "*/__init__.py", "app/dependencies.py"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
